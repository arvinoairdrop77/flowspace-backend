# ==========================================
# KONFIGURASI DATABASE
# ==========================================
# Secara default, aplikasi akan pakai Database Lokal (buat ngoding di laptop).
# TAPI, kalau di server (SnapDeploy) ada Environment Variables (SPRING_DATASOURCE_URL, dll),
# Spring Boot bakal otomatis pakai Database Neon (Cloud).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-spring-math-b5w1vza1-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_B6ZyRELn3CKr}

# ==========================================
# KONFIGURASI JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# ==========================================
# KONFIGURASI JWT
# ==========================================
# Di lokal pakai secret ini, di cloud bakal ngambil dari Environment Variables (JWT_SECRET)
jwt.secret=${JWT_SECRET:rahasiaSuperPanjangMinimal32KarakterYa!!}
jwt.expiration=86400000

# ==========================================
# KONFIGURASI PORT
# ==========================================
# Ini trik paling penting: Kalau di SnapDeploy ada env PORT, pakai itu. Kalau nggak ada, pakai 8080.
server.port=${PORT:8080}